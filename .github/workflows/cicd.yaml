name: ci-cd

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "exercise-2-cicd/**"
      - ".github/workflows/cicd.yaml"
  push:
    branches: [ "main" ]
    paths:
      - "exercise-2-cicd/**"
      - ".github/workflows/cicd.yaml"

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: exercise-2-cicd/app
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/anthropic-assessment-app

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m pytest -q

  build_and_scan:
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t "${IMAGE_NAME}:${{ github.sha }}" "${APP_DIR}"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push image
        run: |
          docker push "${IMAGE_NAME}:${{ github.sha }}"

  deploy_staging:
    runs-on: ubuntu-latest
    needs: [ build_and_scan ]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Render manifest (staging)
        run: |
          sed -e "s|IMAGE_PLACEHOLDER|${IMAGE_NAME}:${{ github.sha }}|g" \
              -e "s|NAMESPACE_PLACEHOLDER|staging|g" \
              exercise-2-cicd/k8s/deploy.yaml > deploy.staging.yaml
      - name: Apply to cluster (placeholder)
        run: |
          echo "kubectl apply -f deploy.staging.yaml"

  deploy_production:
    runs-on: ubuntu-latest
    needs: [ deploy_staging ]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Render manifest (production)
        run: |
          sed -e "s|IMAGE_PLACEHOLDER|${IMAGE_NAME}:${{ github.sha }}|g" \
              -e "s|NAMESPACE_PLACEHOLDER|production|g" \
              exercise-2-cicd/k8s/deploy.yaml > deploy.prod.yaml
      - name: Apply to cluster (placeholder)
        run: |
          echo "kubectl apply -f deploy.prod.yaml"

  rollback_notes:
    runs-on: ubuntu-latest
    needs: [ deploy_production ]
    if: always()
    steps:
      - name: Rollback strategy
        run: |
          echo "Rollback: kubectl rollout undo deploy/assessment-app -n <namespace>"
